apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-deployment
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nodejs-app
          image: swapnil9998/nodejs-devops:v2
          imagePullPolicy: Always
          ports:
            - containerport: 3000
          readinessProbe:
             httpGet:
                path: /health
                port: 3000
             initialDelaySeconds: 5
             periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
