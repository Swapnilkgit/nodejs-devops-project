kind: Deployment
apiVersion: apps/v1
metadata:
  name: nodejs-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
        - name: nodejs-app
          image: swapnil9998/nodejs-devops:v1
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
